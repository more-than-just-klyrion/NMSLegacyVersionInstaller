name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore NMSLegacyVersionInstaller.sln

      - name: Build (Release|x86)
        id: msbuild
        shell: pwsh
        run: |
          msbuild NMSLegacyVersionInstaller.sln /p:Configuration=Release /p:Platform=x86 /m 2>&1 `
            | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Post build log on failure
        if: failure() && steps.msbuild.outcome == 'failure'
        shell: pwsh
        run: |
          $tail = (Get-Content build.log -Tail 200) -join "`n"
          $body = "Build failed. Last 200 lines of msbuild output:`n`n``````n$tail`n``````"
          $json = @{ body = $body } | ConvertTo-Json
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/comments" -Method Post -Headers $headers -Body $json -ContentType "application/json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Locate build output
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter "NMSLegacyVersionInstaller.exe" `
            | Where-Object { $_.FullName -match "\\bin\\x86\\Release\\" } `
            | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path . -Recurse -Filter "NMSLegacyVersionInstaller.exe" `
              | Where-Object { $_.FullName -match "\\Release\\" } `
              | Select-Object -First 1
          }
          if (-not $exe) { throw "Build output NMSLegacyVersionInstaller.exe not found" }
          echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NMSLegacyVersionInstaller
          path: ${{ steps.locate.outputs.exe_path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.exe_path }}
          generate_release_notes: true
